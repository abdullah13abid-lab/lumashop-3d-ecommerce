version: '3.8'

services:
  # Backend API
  backend:
    build: ./backend
    container_name: lumashop-backend
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=development
      - PORT=5000
      - MONGODB_URI=mongodb://mongo:27017/lumashop
      - JWT_SECRET=your_jwt_secret_key_here_12345
      - STRIPE_SECRET_KEY=sk_test_dummy
      - STRIPE_PUBLISHABLE_KEY=pk_test_dummy
      - FRONTEND_URL=http://localhost:5173
    depends_on:
      - mongo
    volumes:
      - ./backend:/app
      - /app/node_modules
    networks:
      - lumashop-network
    restart: unless-stopped

  # MongoDB Database
  mongo:
    image: mongo:7.0
    container_name: lumashop-mongo
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_DATABASE=lumashop
    volumes:
      - mongo_data:/data/db
      - mongo_config:/data/configdb
    networks:
      - lumashop-network
    restart: unless-stopped
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  # Frontend App
  frontend:
    build: ./frontend
    container_name: lumashop-frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:5000
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - lumashop-network
    restart: unless-stopped

volumes:
  mongo_data:
  mongo_config:

networks:
  lumashop-network:
    driver: bridge
